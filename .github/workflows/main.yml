name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Compile & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        run: gradle wrapper --gradle-version=7.6.1
        working-directory: ProjectWatchApp_

      - name: Grant Gradle execute permission
        run: chmod +x gradlew
        working-directory: ProjectWatchApp_

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: ProjectWatchApp_
