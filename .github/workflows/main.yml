name: Android Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    name: Compile & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        run: gradle wrapper --gradle-version=8.13 --gradle-distribution-sha256-sum=0e0ec66112d10db3ee0abcc262d521c54ca88ccd04a17148bdb4e5c2e900a45a
        working-directory: ProjectWatchApp_

      - name: Grant Gradle execute permission
        run: chmod +x gradlew
        working-directory: ProjectWatchApp_

      - name: Build debug APK
        run: ./gradlew assembleDebug
        working-directory: ProjectWatchApp_
